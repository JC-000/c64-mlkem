# mlkem.cfg — ld65 configuration for the c64-mlkem STANDALONE test PRG.
#
# This is the library author's own build (`make`, `make test`, `make bench`).
# Consumers do NOT use this file — see cfg/mlkem-example.cfg for the fragment
# to copy into your own memory map.
#
# Layout:
#   $0801        BASIC stub (SYS 2061)
#   $080D        driver entry (main.s `start`)
#   ...          driver + library code, then rodata
#   (last)       bss: driver BSS, then the page-aligned Keccak state
#
# P1 uses NO REU and reserves no equate-placed regions, so there is no image
# guard here yet. Add one if a later phase places a table by equate.

FEATURES {
    STARTADDRESS: default = $0801;
}

# No SYMBOLS block: src/main.s writes the 2-byte PRG header itself via the
# LOADADDR segment, so there is no __LOADADDR__ to import. Declaring
# `__LOADADDR__: type = import` here without an exporter is itself the
# reference that fails the link ("Unresolved external ... referenced in
# cfg/mlkem.cfg").

MEMORY {
    # ZP region exists so ld65 can place a ZEROPAGE segment. Actual slot
    # allocation is by §2 equates in src/zp_config.s, not by the linker.
    ZP:       file = "", start = $0002, size = $00FD, define = yes;

    # 2-byte PRG load-address header, written to the file before MAIN.
    LOADADDR: file = %O, start = %S - 2, size = $0002;

    # Main RAM: BASIC stub + code + rodata + bss, up to the I/O area.
    # define = yes publishes __MAIN_SIZE__ / __MAIN_LAST__ for footprint and
    # image-guard asserts (the image must end below an equate-placed region).
    MAIN:     file = %O, start = %S,     size = $D000 - %S, define = yes;
}

SEGMENTS {
    ZEROPAGE:         load = ZP,       type = zp,  optional = yes;
    LOADADDR:         load = LOADADDR, type = ro;
    BASICSTUB:        load = MAIN,     type = ro;

    # Driver / harness code. main.o must link FIRST so `start` lands at
    # $080D, matching the SYS 2061 in the BASIC stub.
    CODE:             load = MAIN,     type = rw;

    # Library code (§4 prefixed name). optional: empty until Phase 1.
    LIB_MLKEM_CODE:   load = MAIN,     type = rw,  optional = yes;

    RODATA:           load = MAIN,     type = ro,  optional = yes;

    # Library rodata: round constants, rho offset/rotate table.
    # align = $40: src/codec.s places three secret-indexed tables (42/42/64 B)
    # at 64 B boundaries so they can never straddle a page; ld65 silently drops
    # a source .align the cfg does not permit (a warning, then a failed
    # lderror assert whenever the layout happens to straddle).
    LIB_MLKEM_RODATA: load = MAIN,     type = ro,  optional = yes, align = $40;

    # ---- bss-type segments MUST stay last in this file-emitting area ----
    # ld65 writes no file bytes for a bss segment. A file-backed segment
    # declared AFTER a non-empty bss one loads that many bytes below its link
    # address, with no link error (contract §4: measured at 9,154 bytes of
    # displacement). Do not reorder these two entries above any ro/rw entry.
    BSS:              load = MAIN,     type = bss, optional = yes, define = yes;

    # REQUIRED align = $100 — the 200-byte Keccak state must be page-aligned.
    # 200 B fits in one page, so alignment keeps `lda keccak_state,x` off a
    # page boundary for every x (input-independent cost) and holds the lane
    # high byte constant, which the fused rho+pi indexed copy depends on.
    # src/state.s carries a matching source-level `.align 256` plus a hard
    # `.assert`: per §4, ld65 warns about a dropped cfg align ONLY when the
    # segment has a source-level .align to check against, and the .assert
    # upgrades that conditional warning to a link error.
    LIB_MLKEM_BSS:    load = MAIN,     type = bss, optional = yes, define = yes, align = $100;
}
