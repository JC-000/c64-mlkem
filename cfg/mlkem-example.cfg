# mlkem-example.cfg — starter fragment for CONSUMERS of c64-mlkem.
#
# Copy these SEGMENTS entries into your own ld65 config. c64-mlkem emits only
# the four LIB_MLKEM_* segments below; it never emits bare CODE / RODATA /
# DATA / BSS (contract §4), so your own entries for those are untouched.
#
# The comments marked REQUIRED are contract §4 "load-bearing cfg attributes":
# they state the attribute, its required value, and what breaks if it is
# wrong. "The link was clean" is not evidence that you got them right — ld65's
# diagnostics for both are conditional on library-internal shape you cannot
# see from here, and neither is ever an error.

SEGMENTS {
    # Library code. No special placement requirement: position-dependent but
    # relocatable anywhere your map has room. c64-https plans to run this from
    # under-KERNAL RAM at $E000; that banking discipline is consumer-side and
    # this library makes no assumption about it.
    LIB_MLKEM_CODE:   load = MAIN, type = ro;

    # Read-only data: Keccak round constants (192 B), NTT zetas and constants
    # (407 B), CBD (32 B), compress tables (256 B). Read-only.
    # REQUIRED align = $40 (link-time obligation, like the BSS $100 below):
    # src/codec.s places three secret-indexed tables at 64 B boundaries so no
    # `abs,x` read ever crosses a page. The sources carry lderror asserts, so a
    # cfg that drops this align FAILS THE LINK whenever the dropped align would
    # let one of those tables straddle a page, rather than silently handing you
    # a secret-dependent page cross; for the layouts where nothing straddles,
    # ld65 only warns. Do not rely on the failure: keep the align. (The NTT
    # zeta table is indexed by public loop position and is exempt.)
    LIB_MLKEM_RODATA: load = MAIN, type = ro, align = $40;

    # REQUIRED align = $100 — the 200-byte Keccak state is page-aligned.
    #   What breaks without it: the state straddles a page boundary, so
    #   `lda keccak_state,x` takes an extra cycle for some x but not others
    #   (making permutation cost input-position dependent), and the fused
    #   rho+pi indexed copy's assumption that a lane's high address byte is
    #   constant no longer holds. src/state.s carries a hard `.assert`, so
    #   dropping this attribute fails the LINK rather than corrupting at
    #   runtime — but only because that assert exists; ld65 alone would at
    #   most warn.
    #
    # REQUIRED last-in-a-file-emitting-area — this is a bss-type segment.
    #   What breaks otherwise: ld65 emits no file bytes for bss. Any
    #   file-backed segment placed AFTER a non-empty bss segment in the same
    #   area loads that many bytes below its link address. Measured by the
    #   contract at 9,154 bytes of displacement, with no error at any stage.
    #   Such a build can appear to work by coincidence.
    LIB_MLKEM_BSS:    load = MAIN, type = bss, define = yes, align = $100;
    #
    # REQUIRED align = $100, bss rules as above — the eight K-PKE polynomials,
    # exactly 4,096 B (v0.6.0: split out of LIB_MLKEM_BSS). Every polynomial
    # routine patches only the high byte of its plane pointer, so an
    # unaligned buffer is silently addressed at its page base; src/kem.s
    # asserts the alignment and the size, so a dropped align fails the link.
    # It may live in a different area from LIB_MLKEM_BSS (e.g. RAM under I/O
    # at $D000 with $01 banked accordingly around every ML-KEM call).
    #
    # Sizes: POLY_BSS is exactly 4,096 B. LIB_MLKEM_BSS is 2,545 B in the
    # library's probe link, but its alignment fill follows the order ld65
    # places the archive members (2,312-3,197 B measured across orderings):
    # size it from YOUR map. Both hold secrets after a call (POLY_BSS: s_hat
    # after mlkem_keygen, secret-derived y/e1/e2 after the Decaps entries;
    # LIB_MLKEM_BSS: m', K', r' in kem_hb) and nothing zeroes them; scrub
    # both if key material must not outlive the call.
    #
    # The line is required whenever mlkem_kem.o is linked (any consumer of the
    # ML-KEM entry points). A consumer that links no K-PKE/ML-KEM member
    # (mlkem-keccak.a alone, or mlkem.a with only Keccak members pulled) has
    # no such segment: it should omit this line or add `optional = yes`,
    # otherwise ld65 warns "Segment 'LIB_MLKEM_POLY_BSS' does not exist". A
    # consumer that links mlkem_kem.o and omits the line (e.g. a v0.5.1 cfg)
    # fails to link:
    # "Missing memory area assignment for segment 'LIB_MLKEM_POLY_BSS'"
    # (ABI 2 -> 3).
    LIB_MLKEM_POLY_BSS: load = MAIN, type = bss, define = yes, align = $100;
}

# §8.1 shared quarter-square table — NOT a segment. c64-mlkem's NTT multiply
# reads the 1,024 B `sqtab` at LIB_SHARED_SQTAB_BASE (lo plane at +0, hi at
# +$200; page-aligned, `$`-free `-D`), a region ld65 knows nothing about:
#
#     ca65 -D LIB_SHARED_SQTAB_BASE=0xBC00 ...      (in CONTRACT_DEFINES —
#                                                   it reaches every library TU)
#
# The standalone default is $9000 (src/sqtab_base.inc, shipped next to this
# file; the ONLY place the default lives). Pick a value clear of your own
# image and of every sibling's window (x25519 $7800, chacha $8000/$8400,
# nist-curves $9C00). Who fills it: in a build WITHOUT -D SHARED_SQTAB_INIT
# this library exports the canonical `mul_tables_init` and you call it once
# at boot; WITH the switch it imports that name from whichever library you
# designated as owner (never both — exactly one owner per link, §8.0).
# `mlkem_arith_init` (the mod-q tables in LIB_MLKEM_BSS) is called once at
# boot in every configuration.
#
# REQUIRED image guard — no linked area may overlap the 1,024 B window
# [LIB_SHARED_SQTAB_BASE, LIB_SHARED_SQTAB_BASE + $0400) — in a TU of YOUR
# build (the library's own guard lives in its driver, which you do not link):
# an image that grows into the window is corrupted silently, never diagnosed
# by ld65. mul_tables_init writes the whole window at run time whatever is
# placed there, so write one assert for EVERY MEMORY area of the link,
# file-emitting or not (a bss-only area, such as one holding only
# LIB_MLKEM_POLY_BSS, is `file = ""` and is written at run time too), and not
# only for areas holding a LIB_MLKEM_* segment. The assert reads "ends at or
# below the window, or starts at or above its end", so an area wholly above
# the window passes (POLY_BSS at $D000). A zero-page area is harmless to
# include. Each area needs `define = yes` in the MEMORY block, or
# __X_START__ / __X_LAST__ are unresolved. The assert must stay on ONE line
# (ca65 has no continuation without `.linecont +`). For an area X:
#
#     .include "sqtab_base.inc"          ; or your own -D value
#     .import __X_START__, __X_LAST__    ; X = MAIN, then each other area
#     .assert (__X_LAST__ <= LIB_SHARED_SQTAB_BASE) .or (__X_START__ >= LIB_SHARED_SQTAB_BASE + $0400), lderror, "area X overlaps the sqtab window"
#
# Zero page: c64-mlkem uses contract §6.2's consumer-assembled ZP model. Its
# slots are NOT exported from any archive — assemble src/zp_config.s into your
# own build and set overrides there:
#
#     ca65 -D mlkem_zp_src=0x40 -D mlkem_zp_dst=0x42 \
#          -D mlkem_zp_len=0x44 -D mlkem_zp_tmp=0x46 \
#          -D mlkem_zp_mul=0x48 src/zp_config.s      (mlkem_zp_mul is 8 B)
#
# Override values must be `$`-free (`0x40` or decimal). An unquoted `$40` is
# eaten by the shell and silently becomes address $00; through make, `$40` and
# `$$40` both yield 0 and `$$$$40` yields the shell PID — none of them
# diagnosed. No library rebuild is needed for a slot override under this model.
