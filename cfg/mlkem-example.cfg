# mlkem-example.cfg — starter fragment for CONSUMERS of c64-mlkem.
#
# Copy these SEGMENTS entries into your own ld65 config. c64-mlkem emits only
# the three LIB_MLKEM_* segments below; it never emits bare CODE / RODATA /
# DATA / BSS (contract §4), so your own entries for those are untouched.
#
# The comments marked REQUIRED are contract §4 "load-bearing cfg attributes":
# they state the attribute, its required value, and what breaks if it is
# wrong. "The link was clean" is not evidence that you got them right — ld65's
# diagnostics for both are conditional on library-internal shape you cannot
# see from here, and neither is ever an error.

SEGMENTS {
    # Library code. No special placement requirement: position-dependent but
    # relocatable anywhere your map has room. c64-https plans to run this from
    # under-KERNAL RAM at $E000; that banking discipline is consumer-side and
    # this library makes no assumption about it.
    LIB_MLKEM_CODE:   load = MAIN, type = ro;

    # Round constants and the rho offset/rotate table. Read-only, no
    # alignment requirement.
    LIB_MLKEM_RODATA: load = MAIN, type = ro;

    # REQUIRED align = $100 — the 200-byte Keccak state is page-aligned.
    #   What breaks without it: the state straddles a page boundary, so
    #   `lda keccak_state,x` takes an extra cycle for some x but not others
    #   (making permutation cost input-position dependent), and the fused
    #   rho+pi indexed copy's assumption that a lane's high address byte is
    #   constant no longer holds. src/state.s carries a hard `.assert`, so
    #   dropping this attribute fails the LINK rather than corrupting at
    #   runtime — but only because that assert exists; ld65 alone would at
    #   most warn.
    #
    # REQUIRED last-in-a-file-emitting-area — this is a bss-type segment.
    #   What breaks otherwise: ld65 emits no file bytes for bss. Any
    #   file-backed segment placed AFTER a non-empty bss segment in the same
    #   area loads that many bytes below its link address. Measured by the
    #   contract at 9,154 bytes of displacement, with no error at any stage.
    #   Such a build can appear to work by coincidence.
    LIB_MLKEM_BSS:    load = MAIN, type = bss, define = yes, align = $100;
}

# Zero page: c64-mlkem uses contract §6.2's consumer-assembled ZP model. Its
# slots are NOT exported from any archive — assemble src/zp_config.s into your
# own build and set overrides there:
#
#     ca65 -D mlkem_zp_src=0x40 -D mlkem_zp_dst=0x42 \
#          -D mlkem_zp_len=0x44 -D mlkem_zp_tmp=0x46 src/zp_config.s
#
# Override values must be `$`-free (`0x40` or decimal). An unquoted `$40` is
# eaten by the shell and silently becomes address $00; through make, `$40` and
# `$$40` both yield 0 and `$$$$40` yields the shell PID — none of them
# diagnosed. No library rebuild is needed for a slot override under this model.
